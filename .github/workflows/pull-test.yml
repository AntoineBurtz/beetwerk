name: Anonymer Pull-Test
on:
  push:
    branches: [diagnose/anonym-pull]
permissions:
  contents: read
  packages: read
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Ohne Anmeldung
        id: anon
        continue-on-error: true
        run: docker logout ghcr.io || true; docker pull ghcr.io/antoineburtz/beetwerk:latest
      - name: Mit Anmeldung
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/antoineburtz/beetwerk:latest
          echo "anonym: ${{ steps.anon.outcome }}"
